<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4, user-scalable=yes">
<style>
:root{--bg:#eef1f7;--bar:#ffffff;--bd:#d5dbe8;--fg:#0f172a;--ac:#016afd;--acbg:#d9e5ff}
:root.dark{--bg:#14171d;--bar:#1e222b;--bd:#343a47;--fg:#e8ecf4;--ac:#7fb0ff;--acbg:#27406e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Roboto,Arial,sans-serif}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--bd);
  display:flex;flex-wrap:nowrap;overflow-x:auto;gap:2px;padding:4px 6px;-webkit-overflow-scrolling:touch}
#bar::-webkit-scrollbar{display:none}
.g{display:flex;gap:2px;align-items:center;padding-right:6px;margin-right:4px;border-right:1px solid var(--bd);flex:none}
.g:last-child{border-right:none}
button{flex:none;min-width:38px;height:38px;border:none;border-radius:8px;background:transparent;color:var(--fg);
  font-size:16px;padding:0 8px;font-family:inherit}
button.on{background:var(--acbg);color:var(--ac)}
button:active{background:var(--acbg)}
#sz{min-width:34px;text-align:center;font-size:14px;flex:none}
.sw{display:inline-block;width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);vertical-align:middle}
#pal{position:fixed;z-index:9;left:8px;right:8px;top:54px;background:var(--bar);border:1px solid var(--bd);border-radius:12px;
  padding:10px;display:none;flex-wrap:wrap;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#pal b{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);display:block}
html{overflow-x:hidden}
#wrap{position:relative;min-height:100vh}
/* лист A4 (210×297 мм) в натуральную ширину; на экране он масштабируется под ширину телефона.
   Рамка — 8 мм от края бумаги, на каждой странице своя */
#sheet{position:absolute;left:0;top:58px;width:210mm;min-height:297mm;transform-origin:0 0;background-color:#fff;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 210 297' preserveAspectRatio='none'><rect x='8' y='8' width='194' height='281' fill='none' stroke='%23555555' stroke-width='0.35'/><line x1='0' y1='296.6' x2='210' y2='296.6' stroke='%23c4cad6' stroke-width='0.8'/></svg>");
  background-repeat:repeat-y;background-size:210mm 297mm;box-shadow:0 1px 8px rgba(0,0,0,.28)}
#doc{background:transparent;color:#111;min-height:297mm;padding:14mm;font-size:16px;line-height:1.45;outline:none;
  word-wrap:break-word;overflow-wrap:anywhere}
#doc p,#doc div{margin:0 0 6px}
#doc h1{font-size:26px;margin:10px 0 8px}#doc h2{font-size:21px;margin:10px 0 6px}
#doc ul,#doc ol{margin:0 0 6px;padding-left:26px}
</style></head><body>
<div id="bar">
 <div class="g"><button data-c="undo">↶</button><button data-c="redo">↷</button></div>
 <div class="g"><button id="blk" data-c="blk">Аа</button></div>
 <div class="g"><button id="szm">−</button><span id="sz">16</span><button id="szp">+</button></div>
 <div class="g"><button data-c="bold" id="b_bold"><b>Ж</b></button><button data-c="italic" id="b_italic"><i>К</i></button>
  <button data-c="underline" id="b_underline"><u>Ч</u></button><button data-c="strikeThrough" id="b_strikeThrough"><s>З</s></button></div>
 <div class="g"><button data-c="fore"><span class="sw" style="background:#d32f2f"></span></button><button data-c="back"><span class="sw" style="background:#ffeb3b"></span></button></div>
 <div class="g"><button data-c="justifyLeft" id="b_justifyLeft">⯇≡</button><button data-c="justifyCenter" id="b_justifyCenter">≡</button>
  <button data-c="justifyRight" id="b_justifyRight">≡⯈</button><button data-c="justifyFull" id="b_justifyFull">☰</button></div>
 <div class="g"><button data-c="insertUnorderedList" id="b_insertUnorderedList">•≡</button><button data-c="insertOrderedList" id="b_insertOrderedList">1≡</button>
  <button data-c="outdent">⇤</button><button data-c="indent">⇥</button></div>
 <div class="g"><button data-c="removeFormat">Tx</button></div>
</div>
<div id="pal"></div>
<div id="wrap"><div id="sheet"><div id="doc" contenteditable="true"><p><br></p></div></div></div>
<script>
var doc=document.getElementById('doc'),pal=document.getElementById('pal'),saved=null,timer=null,palMode='';
var SIZES=[10,12,14,16,18,20,24,28,32,36,40,48,56,64,72];
var COLORS=['#000000','#444444','#888888','#d32f2f','#f57c00','#fbc02d','#388e3c','#0097a7','#1976d2','#7b1fa2','#c2185b','#ffffff'];
var BACKS=['transparent','#fff59d','#ffe0b2','#ffcdd2','#c8e6c9','#b3e5fc','#d1c4e9','#f8bbd0','#e0e0e0'];
try{document.execCommand('defaultParagraphSeparator',false,'p');document.execCommand('styleWithCSS',false,true);}catch(e){}

function inDoc(n){return n&&doc.contains(n)}
function saveSel(){var s=getSelection();if(s.rangeCount&&inDoc(s.anchorNode))saved=s.getRangeAt(0).cloneRange()}
function restoreSel(){doc.focus();if(saved){var s=getSelection();s.removeAllRanges();s.addRange(saved)}}
var sheet=document.getElementById('sheet'),wrap=document.getElementById('wrap');
function fit(){
  var vw=document.documentElement.clientWidth,sw=sheet.offsetWidth;
  if(!sw)return;
  var z=Math.max(0.25,(vw-12)/sw),pageH=297*sw/210;
  doc.style.minHeight='0';
  var pages=Math.max(1,Math.ceil((doc.scrollHeight-2)/pageH));
  doc.style.minHeight=(pages*297)+'mm';
  sheet.style.transform='translateX('+Math.max(0,(vw-sw*z)/2)+'px) scale('+z+')';
  wrap.style.height=(58+sheet.offsetHeight*z+40)+'px';
}
window.addEventListener('resize',fit);
function changed(){
  fit();
  clearTimeout(timer);
  timer=setTimeout(function(){if(window.Host&&Host.onChange)Host.onChange(doc.innerHTML)},500);
}
function blockOf(n){
  while(n&&n!==doc){if(n.nodeType===1&&/^(P|DIV|LI|H1|H2|H3|BLOCKQUOTE)$/.test(n.tagName))return n;n=n.parentNode}
  return null;
}
function curSize(){
  var s=getSelection();if(!s.rangeCount||!inDoc(s.anchorNode))return 16;
  var n=s.anchorNode;if(n.nodeType===3)n=n.parentNode;
  return Math.round(parseFloat(getComputedStyle(n).fontSize))||16;
}
function refresh(){
  var s=getSelection();
  if(s.rangeCount&&inDoc(s.anchorNode)){
    saveSel();
    document.getElementById('sz').textContent=curSize();
    ['bold','italic','underline','strikeThrough','justifyLeft','justifyCenter','justifyRight','justifyFull','insertUnorderedList','insertOrderedList'].forEach(function(c){
      var b=document.getElementById('b_'+c),on=false;try{on=document.queryCommandState(c)}catch(e){}
      b.classList.toggle('on',!!on);
    });
  }
}
document.addEventListener('selectionchange',refresh);
doc.addEventListener('input',changed);
doc.addEventListener('blur',saveSel);
// панель не должна отбирать фокус/выделение у текста
document.getElementById('bar').addEventListener('mousedown',function(e){e.preventDefault()});
pal.addEventListener('mousedown',function(e){e.preventDefault()});

function applySize(px){
  restoreSel();
  var s=getSelection();
  if(!s.rangeCount)return;
  if(s.isCollapsed){
    var b=blockOf(s.anchorNode);
    if(b){b.style.fontSize=px+'px';[].forEach.call(b.querySelectorAll('[style*="font-size"]'),function(e){e.style.fontSize=''})}
  }else{
    document.execCommand('fontSize',false,'7');
    [].forEach.call(doc.querySelectorAll('font[size="7"]'),function(f){
      var sp=document.createElement('span');sp.style.fontSize=px+'px';
      while(f.firstChild)sp.appendChild(f.firstChild);f.parentNode.replaceChild(sp,f);
    });
    [].forEach.call(doc.querySelectorAll('span[style*="font-size: xxx-large"],span[style*="font-size: -webkit-xxx-large"]'),function(sp){sp.style.fontSize=px+'px'});
  }
  document.getElementById('sz').textContent=px;changed();saveSel();
}
function stepSize(d){
  var c=curSize(),n=c,k;
  if(d>0){for(k=0;k<SIZES.length;k++){if(SIZES[k]>c){n=SIZES[k];break}}}
  else{for(k=SIZES.length-1;k>=0;k--){if(SIZES[k]<c){n=SIZES[k];break}}}
  if(n!==c)applySize(n);
}
function showPal(mode){
  if(palMode===mode&&pal.style.display==='flex'){pal.style.display='none';return}
  palMode=mode;pal.innerHTML='';
  (mode==='fore'?COLORS:BACKS).forEach(function(c){
    var d=document.createElement('b');d.style.background=c==='transparent'?'repeating-linear-gradient(45deg,#fff,#fff 4px,#ddd 4px,#ddd 8px)':c;
    d.onclick=function(){restoreSel();
      document.execCommand(mode==='fore'?'foreColor':'hiliteColor',false,c==='transparent'?'#ffffff':c);
      pal.style.display='none';changed();saveSel()};
    pal.appendChild(d);
  });
  pal.style.display='flex';
}
function showBlocks(){
  if(palMode==='blk'&&pal.style.display==='flex'){pal.style.display='none';return}
  palMode='blk';pal.innerHTML='';
  [['Обычный','P'],['Заголовок 1','H1'],['Заголовок 2','H2']].forEach(function(x){
    var b=document.createElement('button');b.textContent=x[0];b.style.border='1px solid var(--bd)';b.style.width='auto';
    b.onclick=function(){restoreSel();document.execCommand('formatBlock',false,x[1]);pal.style.display='none';changed();saveSel()};
    pal.appendChild(b);
  });
  pal.style.display='flex';
}
document.getElementById('szm').onclick=function(){stepSize(-1)};
document.getElementById('szp').onclick=function(){stepSize(1)};
[].forEach.call(document.querySelectorAll('button[data-c]'),function(b){
  b.addEventListener('click',function(){
    var c=b.getAttribute('data-c');
    if(c==='fore'||c==='back'){showPal(c);return}
    if(c==='blk'){showBlocks();return}
    pal.style.display='none';
    restoreSel();document.execCommand(c,false,null);changed();saveSel();refresh();
  });
});
doc.addEventListener('focus',function(){pal.style.display='none'});

window.setDoc=function(html,dark){
  document.documentElement.classList.toggle('dark',!!dark);
  doc.innerHTML=(html&&html.length)?html:'<p><br></p>';
  fit();
};
window.getDoc=function(){return doc.innerHTML};
window.getPrintHtml=function(title){
  var css='@page{size:A4;margin:14mm}body{font-family:Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;color:#000;margin:0}'+
   'p,div{margin:0 0 6px}h1{font-size:26px;margin:10px 0 8px}h2{font-size:21px;margin:10px 0 6px}ul,ol{margin:0 0 6px;padding-left:26px}'+
   'table{border-collapse:collapse}td,th{border:1px solid #888;padding:4px 6px}'+
   'body::before{content:"";position:fixed;left:-6mm;top:-6mm;right:-6mm;bottom:-6mm;border:0.35mm solid #555}';
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+String(title||'').replace(/</g,'&lt;')+'</title><style>'+css+'</style></head><body>'+doc.innerHTML+'</body></html>';
};
fit();
if(window.Host&&Host.ready)Host.ready();
</script></body></html>
